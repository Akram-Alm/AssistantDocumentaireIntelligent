name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-build-test:
    name: Build et tests .NET
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer les dépendances (webapp)
        run: dotnet restore
        working-directory: ./Assistant2

      - name: Compiler (webapp)
        run: dotnet build --no-restore --configuration Release
        working-directory: ./Assistant2

      - name: Restaurer les dépendances (tests)
        run: dotnet restore
        working-directory: ./AssistantDocumentaire1.Tests

      - name: Exécuter les tests
        run: dotnet test --configuration Release --verbosity normal
        working-directory: ./AssistantDocumentaire1.Tests

  python-build-test:
    name: Build et tests Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt
        working-directory: ./AssistantDocumentaire1.RAGService

      - name: Exécuter les tests
        run: pytest -v
        working-directory: ./AssistantDocumentaire1.RAGService

  docker-build:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: [dotnet-build-test, python-build-test]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Construire l'image webapp
        run: docker build -t assistant-webapp:ci ./Assistant2

      - name: Construire l'image ragservice
        run: docker build -t assistant-ragservice:ci ./AssistantDocumentaire1.RAGService